<!DOCTYPE html>
<html lang="en" ng-app="myapp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Angular project</title>
    <!-- Fixed folder name to node_modules -->
    <script src="node_modules/angular/angular.js"></script>
    <!-- Fixed file path spacing/encoding -->
    <script src="JS app.js"></script>
</head>
<body ng-controller="mycontroller">
    <h1>Student Details</h1>
    
    <!-- Input Fields -->
    <p>Name: <input type="text" ng-model="name"></p>
    <p>Age: <input type="number" ng-model="age"></p>
    <p>Department: <input type="text" ng-model="department"></p>
    <p>Semester: <input type="text" ng-model="semester"></p>
    
    <hr>
    
    <!-- Entered Details Output -->
    <h3>Entered Details:</h3>
    <p>Name: {{ name }}</p>
    <p>Age: {{ age }}</p>
    <p>Department: {{ department }}</p>
    <p>Semester: {{ semester }}</p>
</body>
</html>
